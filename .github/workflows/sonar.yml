name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  sonar:
    # PRs from forks or Dependabot do not have access to workflow secrets so Sonarqube fails.
    # Therefore we are skipping this job on forks and Dependabot PRs.
    if: contains(github.event.pull_request.head.repo.url, '/repos/zowe/cics-for-zowe-client') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Update Dependencies
        id: npm-update
        uses: zowe-actions/octorelease/script@e0672bf28f74f36219713afe75915ea2dc7bf85b # v1
        with:
          config-dir: .github
          script: npmUpdate

      - name: Build Source
        id: build
        run: npm run build

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}