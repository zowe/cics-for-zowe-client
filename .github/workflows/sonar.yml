name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  sonar:
    # PRs from forks or Dependabot do not have access to workflow secrets so Sonarqube fails.
    # Therefore we are skipping this job on forks and Dependabot PRs.
    if: contains(github.event.pull_request.head.repo.url, '/repos/zowe/cics-for-zowe-client') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Dependencies
        id: npm-update
        uses: zowe-actions/octorelease/script@e4c509e08c4dfca0186571e937c605284a50de06 # v1
        with:
          config-dir: .github
          script: npmUpdate

      - name: Build Source
        id: build
        run: pnpm run build

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}