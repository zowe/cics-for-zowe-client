version: 2
updates:
  # Enable updates for GitHub actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    target-branch: "main"
  # Enable updates for GitHub actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    target-branch: "zowe-v2-lts"
  # Keep Zowe dependencies up to date
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@zowe/imperative"
      - dependency-name: "@zowe/zowe-explorer-api"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    target-branch: "main"
  # Keep Zowe dependencies up to date
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@zowe/imperative"
      - dependency-name: "@zowe/zowe-explorer-api"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    target-branch: "zowe-v2-lts"
